name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install ruff
    - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq xvfb
    - run: pip install kivy pytest pytest-cov
    - name: Run tests
      run: xvfb-run pytest tests/ -v --tb=short

  build-apk:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build APK in Docker
      run: |
        docker run --rm -v $PWD:/app -w /app kivy/buildozer:latest \
          bash -c "buildozer android debug"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: plane_war_apk
        path: bin/*.apk
